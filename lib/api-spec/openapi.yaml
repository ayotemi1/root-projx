openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Root ProjX API — community giving platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: organisations
    description: Organisation profiles
  - name: donations
    description: Donation flows
  - name: feed
    description: Impact updates
  - name: follows
    description: Follow relationships
  - name: help
    description: Get Help directory
  - name: profile
    description: User profile
paths:
  /post-viewer/{kind}/{id}:
    parameters: &postViewerParams
      - {name: kind, in: path, required: true, schema: {type: string, enum: [update, post]}}
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getPostViewer
      responses:
        '200':
          description: Visible post and attachments
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PostViewerRecord'}
  /post-viewer/{kind}/{id}/activity:
    parameters: *postViewerParams
    get:
      operationId: getPostActivity
      responses:
        '200':
          description: Authorised post reactions and comments
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PostActivity'}
  /post-viewer/{kind}/{id}/like:
    parameters: *postViewerParams
    put:
      operationId: setPostLike
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PostReactionInput'}
      responses:
        '200':
          description: Updated activity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PostActivity'}
  /post-viewer/{kind}/{id}/comments:
    parameters: *postViewerParams
    post:
      operationId: addPostComment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PostCommentInput'}
      responses:
        '200':
          description: Updated activity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PostActivity'}
  /post-viewer/{kind}/{id}/comments/{commentId}/like:
    parameters:
      - {name: kind, in: path, required: true, schema: {type: string, enum: [update, post]}}
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: commentId, in: path, required: true, schema: {type: string}}
    put:
      operationId: setPostCommentLike
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PostReactionInput'}
      responses:
        '200':
          description: Updated activity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PostActivity'}
  /organisation-team:
    get:
      operationId: listManagedOrganisations
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Organisations this signed-in account may manage
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedOrganisations'}
  /organisation-team/session:
    get:
      operationId: getOrganisationManagerSession
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Current authorised organisation context
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedOrganisation'}
  /organisation-team/{orgId}:
    parameters:
      - {name: orgId, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$'}}
    get:
      operationId: getOrganisationManagers
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Owner-only account manager list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganisationManagers'}
    post:
      operationId: addOrganisationManager
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrganisationManagerInput'}
      responses:
        '200':
          description: Updated account manager list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganisationManagers'}
  /organisation-team/{orgId}/{userId}:
    delete:
      operationId: removeOrganisationManager
      security: [{bearerAuth: []}]
      parameters:
        - {name: orgId, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$'}}
        - {name: userId, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$'}}
      responses:
        '200':
          description: Updated account manager list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganisationManagers'}
  /organisation-team/{orgId}/session:
    post:
      operationId: startOrganisationManagerSession
      security: [{bearerAuth: []}]
      parameters:
        - {name: orgId, in: path, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$'}}
      responses:
        '200':
          description: Short-lived content and Inbox access, never financial or owner privileges
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrganisationManagerSession'}
  /messaging/context:
    get:
      operationId: getMessagingContext
      tags: [profile]
      responses:
        '200':
          description: Own personal and authorised organisation inboxes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessagingContext'}
        '401': {description: Sign in required}
        '503': {description: Messaging unavailable}
  /messaging/conversations:
    get:
      operationId: listMessageConversations
      tags: [profile]
      parameters:
        - {in: query, name: orgId, schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$'}}
      responses:
        '200':
          description: Only conversations in the authorised inbox
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageInbox'}
        '401': {description: Sign in required}
        '404': {description: Inbox unavailable}
        '503': {description: Messaging unavailable}
    post:
      operationId: startMessageConversation
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessageConversationInput'}
      responses:
        '200':
          description: Existing or new conversation for this supporter and organisation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageConversation'}
        '400': {description: Invalid request}
        '401': {description: Sign in required}
        '403': {description: Supporter required}
        '404': {description: Organisation unavailable}
        '429': {description: Slow down and retry after a minute}
        '503': {description: Messaging unavailable}
  /messaging/messages:
    get:
      operationId: getConversationMessages
      tags: [profile]
      parameters:
        - {in: query, name: conversationId, required: true, schema: {type: string, pattern: '^c_[A-Za-z0-9_-]{43}$'}}
        - {in: query, name: orgId, schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$'}}
        - {in: query, name: beforeSequence, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Plain-text message page, oldest first; reading alone does not mark read
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationMessages'}
        '400': {description: Invalid request}
        '401': {description: Sign in required}
        '404': {description: Conversation unavailable}
        '503': {description: Messaging unavailable}
  /messaging/conversations/{id}/messages:
    post:
      operationId: sendConversationMessage
      tags: [profile]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, pattern: '^c_[A-Za-z0-9_-]{43}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConversationMessageInput'}
      responses:
        '200':
          description: Persisted message; same client ID retries never send twice
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationMessage'}
        '400': {description: Invalid message}
        '401': {description: Sign in required}
        '404': {description: Conversation unavailable}
        '409': {description: Retry identifier used for different text or sender side}
        '429': {description: Slow down and retry after a minute}
        '503': {description: Send not confirmed; retain draft for retry}
  /messaging/conversations/{id}/read:
    post:
      operationId: markConversationRead
      tags: [profile]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, pattern: '^c_[A-Za-z0-9_-]{43}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConversationReadInput'}
      responses:
        '200':
          description: Updated conversation with persistent monotonic read cursor
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessageConversation'}
        '400': {description: Invalid request}
        '401': {description: Sign in required}
        '404': {description: Conversation unavailable}
        '503': {description: Could not save read status}
  /messaging/access/{orgId}:
    get:
      operationId: getMessagingTeam
      tags: [organisations]
      parameters:
        - {in: path, name: orgId, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$'}}
      responses:
        '200':
          description: Owner-only messaging team
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessagingTeam'}
        '401': {description: Sign in required}
        '404': {description: Owner access required}
        '503': {description: Team unavailable}
    post:
      operationId: addMessagingTeamMember
      tags: [organisations]
      parameters:
        - {in: path, name: orgId, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessagingTeamInput'}
      responses:
        '200':
          description: Existing account granted messaging-only access
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessagingTeam'}
        '400': {description: Check account ID or team size}
        '429': {description: Slow down and retry after a minute}
        '401': {description: Sign in required}
        '404': {description: Owner access required}
        '503': {description: Could not save access}
  /messaging/access/{orgId}/{userId}:
    delete:
      operationId: removeMessagingTeamMember
      tags: [organisations]
      parameters:
        - {in: path, name: orgId, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$'}}
        - {in: path, name: userId, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$'}}
      responses:
        '200':
          description: Messaging-only access revoked
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessagingTeam'}
        '401': {description: Sign in required}
        '404': {description: Owner access required}
        '503': {description: Could not remove access}
  /supporter-notifications:
    get:
      operationId: listSupporterNotifications
      tags: [profile]
      summary: Private notifications derived from the signed-in supporter's follows and donations
      responses:
        '200':
          description: Newest first, with the recipient's persistent read state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SupporterNotificationInbox'}
        '401': {description: Sign-in required}
        '403': {description: Supporter required}
        '503': {description: Notifications unavailable}
  /supporter-notifications/{id}/read:
    post:
      operationId: readSupporterNotification
      tags: [profile]
      summary: Mark one of the recipient's own notifications read
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, pattern: '^n_[A-Za-z0-9_-]{32}$'}
      responses:
        '200':
          description: Updated private inbox
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SupporterNotificationInbox'}
        '401': {description: Sign-in required}
        '403': {description: Supporter required}
        '404': {description: Notification unavailable}
        '503': {description: Could not mark read}
  /profile/interests:
    get:
      operationId: getSupporterInterests
      tags: [profile]
      summary: Read the signed-in supporter's private interests
      responses:
        '200':
          description: Saved sectors, empty for an account with no interests
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SupporterInterests'}
        '401': {description: Sign-in required}
        '403': {description: Supporter account required}
        '404': {description: Profile not found}
        '503': {description: Interests unavailable}
    put:
      operationId: saveSupporterInterests
      tags: [profile]
      summary: Replace the signed-in supporter's private interests
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SupporterInterests'}
      responses:
        '200':
          description: Saved interests
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SupporterInterests'}
        '400': {description: Invalid sector selections}
        '401': {description: Sign-in required}
        '403': {description: Supporter account required}
        '404': {description: Profile not found}
        '503': {description: Interests could not be saved}
  /uploads/video/request:
    post:
      operationId: requestVideoUpload
      summary: Request a direct storage upload for an organisation video
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VideoUploadRequest'}
      responses:
        '200':
          description: Short-lived upload URL and owner-scoped pending path
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VideoUploadTarget'}
        '400': {description: Invalid file metadata}
        '401': {description: Sign-in required}
        '403': {description: Approved organisation required}
        '413': {description: Video exceeds 500 MB}
  /uploads/video/complete:
    post:
      operationId: completeVideoUpload
      summary: Verify uploaded video and return its public playback URL
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VideoUploadCompletion'}
      responses:
        '200':
          description: Validated video, ready to attach to a campaign or post
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VideoUploadResult'}
        '400': {description: Invalid or incomplete uploaded video}
        '401': {description: Sign-in required}
        '403': {description: Organisation does not own this pending upload}
        '413': {description: Actual video size exceeds 500 MB}
  /admin/email/test:
    post:
      operationId: sendAdminTestEmail
      summary: Send one labelled test email to the configured team address
      parameters:
        - in: header
          name: x-admin-token
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Brevo accepted the message, not proof of inbox delivery
          content:
            application/json:
              schema:
                type: object
                required: [accepted, recipient, environment, sentAt]
                properties:
                  accepted: {type: boolean}
                  recipient: {type: string}
                  environment: {type: string, enum: [production, development]}
                  sentAt: {type: string}
        '401': {description: Administrator authentication required}
        '429': {description: Wait one minute between attempts}
        '502': {description: Brevo rejected the request or could not be reached}
        '503': {description: Administrator or email configuration missing}
  /payout/bank-details:
    get:
      operationId: getBankDetailsStatus
      tags: [profile]
      summary: Get the owning organisation's bank-detail submission status
      responses:
        '200':
          description: Private status only, never account numbers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BankDetailsStatus'}
        '401': {description: Sign-in required}
        '403': {description: Approved organisation owner required}
        '503': {description: Secure storage unavailable}
    put:
      operationId: saveBankDetails
      tags: [profile]
      summary: Encrypt and save payout bank details, withdrawing previous approval atomically
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BankDetailsInput'}
      responses:
        '200':
          description: Saved for administrator review, not approved and no money sent
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BankDetailsStatus'}
        '400': {description: Invalid bank details}
        '401': {description: Sign-in required}
        '403': {description: Approved organisation owner required}
        '503': {description: Save failed or secure storage unavailable}
  /admin/organisations/{id}/bank-details/status:
    get:
      operationId: getAdminBankDetailsStatus
      tags: [profile]
      summary: Metadata-only bank review with no decryption
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Submission status only
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BankDetailsStatus'}
        '401': {description: Administrator authentication required}
        '404': {description: Organisation not found}
        '503': {description: Secure storage unavailable}
  /admin/organisations/{id}/bank-details:
    get:
      operationId: reviewBankDetails
      tags: [profile]
      summary: Explicit audited reveal of decrypted bank details, never cache
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Submission status and private bank details
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/BankDetailsStatus'}
                  - type: object
                    properties:
                      details:
                        anyOf:
                          - {$ref: '#/components/schemas/BankDetailsInput'}
                          - {type: 'null'}
        '401': {description: Administrator authentication required}
        '503': {description: Secure storage or durable audit unavailable}
  /admin/organisations/{id}/bank-details/approve:
    post:
      operationId: approveBankDetails
      tags: [profile]
      summary: Approve exactly the reviewed bank-detail revision
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BankDetailsApprovalInput'}
      responses:
        '200': {description: "Approved, no money has been sent"}
        '400': {description: Missing revision}
        '401': {description: Administrator authentication required}
        '409': {description: "Details changed or payout in progress, reopen the review"}
  /auth/forgot-password:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request a Firebase password-reset email
      description: Rate-limited. Returns the same confirmation for registered and unknown addresses. Firebase handles expiring single-use reset links.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordResetRequest'}
      responses:
        '200':
          description: Neutral confirmation that does not reveal account existence
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string}
        '400': {description: Invalid email}
        '429': {description: Too many requests}
        '503': {description: Reset email provider temporarily unavailable}
  /auth/reset-password:
    post:
      operationId: applyPasswordReset
      tags: [auth]
      summary: Verify a reset code or apply a new password using that code
      description: No sign-in required. Omitting newPassword verifies only and does not consume the code. Firebase enforces expiry, single use and password policy. Never log request bodies.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordResetActionInput'}
      responses:
        '200':
          description: Valid code or password successfully changed
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string}
        '400': {description: "Expired or invalid code, or password does not meet requirements"}
        '429': {description: Too many requests}
        '503': {description: Reset provider temporarily unavailable}
  /donations/checkout:
    post:
      operationId: createDonationCheckoutSession
      tags: [donations]
      summary: Create a donation Checkout session with optional public-name consent
      description: Supports a signed-in donor or a guest supplying guestEmail. Account names and privacy preferences are read server-side for signed-in donors.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DonationCheckoutInput'}
      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DonationCheckoutResult'}
        '400': {description: Invalid donation or public-name consent}
  /donations/anonymous-checkout:
    post:
      operationId: createAnonymousDonationCheckoutSession
      tags: [donations]
      summary: Create a no-account Checkout session with optional public-name consent
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DonationCheckoutInput'}
      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DonationCheckoutResult'}
        '400': {description: Invalid donation or public-name consent}
  /organisations/{id}/campaigns/{campId}/preview:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: campId, in: path, required: true, schema: {type: string}}
    get:
      operationId: getOwnerCampaignPreview
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Owner-only actual campaign render data; never publicly cached
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CampaignLandingView"}
        "403": {description: Only the approved owning organisation may preview}
  /organisations/{id}/dashboard-summary:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getOrganisationRunningSummary
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Available balances and activity; unavailable sections are explicitly identified
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OrganisationRunningSummary"}
        "503": {description: Retry loading balances; no zero fallback}
  /organisations/{id}/walkthrough:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getOrganisationWalkthrough
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Private resume state and actual preview interactions
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WalkthroughView"}
    patch:
      operationId: saveOrganisationWalkthrough
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WalkthroughProgress"}
      responses:
        "200":
          description: Saved resume pointer; completion must satisfy actual saved content
          content:
            application/json:
              schema:
                type: object
                properties:
                  walkthrough: {$ref: "#/components/schemas/WalkthroughProgress"}
        "400": {description: Complete the required saved actions before finishing}
  /organisations/{id}/walkthrough/events:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      operationId: recordOrganisationPreviewOpen
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WalkthroughPreviewEvent"}
      responses:
        "200":
          description: Preview interaction recorded separately from resume state
          content:
            application/json:
              schema:
                type: object
                properties: {recorded: {type: boolean}, at: {type: string}}
  /wise/disbursements:
    get:
      operationId: getWiseDisbursements
      security: [{adminSecret: []}]
      parameters:
        - in: query
          name: orgId
          required: true
          schema:
            type: string
            minLength: 1
            pattern: '^[^/\s]+$'
      responses:
        "200":
          description: Full organisation disbursement history, newest first
          content:
            application/json:
              schema:
                type: object
                required: [disbursements]
                properties:
                  disbursements:
                    type: array
                    items: {$ref: "#/components/schemas/WiseDisbursement"}
        "400": {description: Invalid or missing organisation ID}
        "401": {description: Admin secret required}
        "503": {description: Admin access not configured}
        "500": {description: History unavailable}
  /organisations/{id}/campaigns:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getPublicCampaigns
      responses:
        "200":
          description: Published campaigns only
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/EditorCampaign"}}
    post:
      operationId: createCampaignDraft
      security: [{bearerAuth: []}]
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CampaignEditorRequest"}
      responses:
        "201":
          description: New private draft; empty content is allowed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EditorCampaign"}
  /organisations/{id}/campaigns/manage:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getManagedCampaignDrafts
      security: [{bearerAuth: []}]
      responses:
        "200":
