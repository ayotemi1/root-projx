          type: string
          enum: [gbp, usd]
          default: gbp
          description: "Campaign goals and donations use this currency. Locked once checkout has started."
        name: {type: string, maxLength: 30}
        pageDesign:
          anyOf:
            - {$ref: "#/components/schemas/CampaignPageDesign"}
            - {type: "null"}
