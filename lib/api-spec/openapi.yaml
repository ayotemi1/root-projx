openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Root ProjX API — community giving platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: organisations
    description: Organisation profiles
  - name: donations
    description: Donation flows
  - name: feed
    description: Impact updates
  - name: follows
    description: Follow relationships
  - name: help
    description: Get Help directory
  - name: profile
    description: User profile
paths:
  /organisations/{id}/campaigns/{campId}/preview:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: campId, in: path, required: true, schema: {type: string}}
    get:
      operationId: getOwnerCampaignPreview
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Owner-only actual campaign render data; never publicly cached
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CampaignLandingView"}
        "403": {description: Only the approved owning organisation may preview}
  /organisations/{id}/dashboard-summary:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getOrganisationRunningSummary
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Real ledger balances, recent consent-safe supporters and activity
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OrganisationRunningSummary"}
        "503": {description: Retry loading balances; no zero fallback}
  /organisations/{id}/walkthrough:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getOrganisationWalkthrough
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Private resume state and actual preview interactions
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WalkthroughView"}
    patch:
      operationId: saveOrganisationWalkthrough
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WalkthroughProgress"}
      responses:
        "200":
          description: Saved resume pointer; completion must satisfy actual saved content
          content:
            application/json:
              schema:
                type: object
                properties:
                  walkthrough: {$ref: "#/components/schemas/WalkthroughProgress"}
        "400": {description: Complete the required saved actions before finishing}
  /organisations/{id}/walkthrough/events:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      operationId: recordOrganisationPreviewOpen
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WalkthroughPreviewEvent"}
      responses:
        "200":
          description: Preview interaction recorded separately from resume state
          content:
            application/json:
              schema:
                type: object
                properties: {recorded: {type: boolean}, at: {type: string}}
  /wise/disbursements:
    get:
      operationId: getWiseDisbursements
      security: [{adminSecret: []}]
      parameters:
        - in: query
          name: orgId
          required: true
          schema:
            type: string
            minLength: 1
            pattern: '^[^/\s]+$'
      responses:
        "200":
          description: Full organisation disbursement history, newest first
          content:
            application/json:
              schema:
                type: object
                required: [disbursements]
                properties:
                  disbursements:
                    type: array
                    items: {$ref: "#/components/schemas/WiseDisbursement"}
        "400": {description: Invalid or missing organisation ID}
        "401": {description: Admin secret required}
        "503": {description: Admin access not configured}
        "500": {description: History unavailable}
  /organisations/{id}/campaigns:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getPublicCampaigns
      responses:
        "200":
          description: Published campaigns only
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/EditorCampaign"}}
    post:
      operationId: createCampaignDraft
      security: [{bearerAuth: []}]
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CampaignEditorRequest"}
      responses:
        "201":
          description: New private draft; empty content is allowed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EditorCampaign"}
  /organisations/{id}/campaigns/manage:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getManagedCampaignDrafts
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Owner-only campaigns with pending revisions overlaid
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/EditorCampaign"}}
  /organisations/{id}/campaigns/{campId}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: campId, in: path, required: true, schema: {type: string}}
    patch:
      operationId: saveCampaignDraft
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CampaignEditorRequest"}
      responses:
        "200":
          description: Updated owner view; published content remains unchanged when saveAsDraft is true
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EditorCampaign"}
        "400":
          description: Correct the fields or unmet publish gates and retry
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string}
                  unmetGates:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        message: {type: string}
                        step: {type: integer}
    delete:
      operationId: deleteManagedCampaign
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Campaign deleted}
  /campaigns/assist/status:
    get:
      operationId: getCampaignAssistStatus
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Feature flag; defaults off
          content:
            application/json:
              schema:
                type: object
                properties: {enabled: {type: boolean}}
                required: [enabled]
  /campaigns/assist:
    post:
      operationId: requestCampaignWritingSuggestion
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignAssistRequest"
      responses:
        "200":
          description: A suggestion only; no campaign is written
          content:
            application/json:
              schema:
                type: object
                properties: {suggestion: {type: string}}
        "503":
          description: Writing assistant is unconfigured; manual editing remains available
        "429": {description: Wait a minute before requesting another suggestion}
  /admin/payouts:
    get:
      operationId: getAdminPayouts
      security: [{adminToken: []}]
      responses:
        "200":
          description: Payout ledger and organisation balances
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PayoutOverview"}
        "401": {description: Admin authentication required}
        "500": {description: Payout ledger unavailable}
  /admin/payouts/run:
    post:
      operationId: runAdminPayouts
      security: [{adminToken: []}]
      responses:
        "200":
          description: Per-organisation settlement outcomes
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PayoutRunResult"}
        "401": {description: Admin authentication required}
        "500": {description: Run could not start}
  /admin/payouts/mark-sent:
    post:
      operationId: markAdminPayoutsSent
      security: [{adminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PayoutSettlementInput"}
      responses:
        "200":
          description: Eligible queued payouts marked sent
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PayoutSettlementResult"}
        "400": {description: Invalid organisation or reference}
        "401": {description: Admin authentication required}
        "409":
          description: No eligible payouts or settlement locked
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PayoutSettlementResult"}
        "500": {description: Recording failed; reconcile before retrying}
  /payouts/my:
    get:
      operationId: getMyPayoutSummary
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Authenticated organisation's private payout summary
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OrgPayoutSummary"}
        "401": {description: Authentication required}
        "403": {description: Approved organisation required}
        "500": {description: Payout summary unavailable}
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organisations:
    get:
      operationId: listOrganisations
      tags: [organisations]
      summary: List organisations
      parameters:
        - name: country
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of organisations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organisation"
    post:
      operationId: createOrganisation
      tags: [organisations]
      summary: Create organisation profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganisationRequest"
      responses:
        "201":
          description: Organisation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"

  /organisations/{id}:
    get:
      operationId: getOrganisation
      tags: [organisations]
      summary: Get organisation by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Organisation profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateOrganisation
      tags: [organisations]
      summary: Update organisation
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganisationRequest"
      responses:
        "200":
          description: Updated organisation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"

  /donations:
    post:
      operationId: createDonation
      tags: [donations]
      summary: Create a donation intent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDonationRequest"
      responses:
        "201":
          description: Donation intent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationIntentResponse"

  /donations/my:
    get:
      operationId: getMyDonations
      tags: [donations]
      summary: Get my donation history
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Donation history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DonationWithOrg"

  /feed:
    get:
      operationId: getFeed
      tags: [feed]
      summary: Get feed for current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Feed updates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UpdateWithOrg"
    post:
      operationId: postUpdate
      tags: [feed]
      summary: Post a new update (org only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUpdateRequest"
      responses:
        "201":
          description: Update posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Update"

  /feed/public:
    get:
      operationId: getPublicFeed
      tags: [feed]
      summary: Get public feed (no auth required)
      responses:
        "200":
          description: Public feed updates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UpdateWithOrg"

  /feed/org/{id}:
    get:
      operationId: getOrgFeed
      tags: [feed]
      summary: Get updates for a specific org
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Org updates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Update"

  /follows:
    post:
      operationId: followOrg
      tags: [follows]
      summary: Follow an organisation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowRequest"
      responses:
        "201":
          description: Followed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /follows/my:
    get:
      operationId: getMyFollows
      tags: [follows]
      summary: Get orgs the current user follows
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Followed orgs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organisation"

  /follows/{orgId}:
    delete:
      operationId: unfollowOrg
      tags: [follows]
      summary: Unfollow an organisation
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unfollowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /help/orgs:
    get:
      operationId: getHelpOrgs
      tags: [help]
      summary: Get orgs opted into Get Help
      parameters:
        - name: need
          in: query
          schema:
            type: string
        - name: country
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Help orgs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organisation"

  /help/contact:
    post:
      operationId: logContactEvent
      tags: [help]
      summary: Log a contact event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactEventRequest"
      responses:
        "201":
          description: Contact event logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /help/reviews/{orgId}:
    get:
      operationId: getHelpReviews
      tags: [help]
      summary: Get help reviews for an org
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Help reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelpReview"

  /help/reviews:
    post:
      operationId: submitHelpReview
      tags: [help]
      summary: Submit a help review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitHelpReviewRequest"
      responses:
        "201":
          description: Review submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpReview"

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile with org if applicable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"

components:
  securitySchemes:
    adminSecret:
      type: apiKey
      in: header
      name: X-Admin-Secret
    adminToken:
      type: apiKey
      in: header
      name: x-admin-token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    WiseDisbursement:
      type: object
      required: [_id, orgId, amountGbp, transferId, disbursedAt, recipientEmail]
      properties:
        _id: {type: string}
        orgId: {type: string}
        amountGbp: {type: number}
        transferId: {type: integer}
        disbursedAt: {type: string}
        recipientEmail: {type: [string, "null"]}
    PayoutRow:
      type: object
      required: [_id, orgId, orgName, donationId, stripeRef, amountGbp, currency, method, status, createdAt]
      properties:
        _id: {type: string}
        orgId: {type: string}
        orgName: {type: string}
        donationId: {type: string}
        stripeRef: {type: string}
        amountGbp: {type: number}
        currency: {type: string}
        method: {type: string, enum: [wise, manual]}
        status: {type: string, enum: [queued, sent, failed]}
        createdAt: {type: string}
        batchId: {type: string}
        wiseTransferId: {type: number}
        sentAt: {type: string}
        sentBy: {type: string}
        reference: {type: string}
        error: {type: string}
    PayoutOrgSummary:
      type: object
      required: [orgId, orgName, method, queuedTotalGbp, eligibleTotalGbp, due, settlementLocked]
      properties:
        orgId: {type: string}
        orgName: {type: string}
        method: {type: string, enum: [stripe_connect, wise, manual, none]}
        queuedTotalGbp: {type: number}
        eligibleTotalGbp: {type: number}
        due: {type: boolean}
        settlementLocked: {type: boolean}
    PayoutOverview:
      type: object
      required: [payouts, organisations, totalQueuedGbp, failureCount]
      properties:
        payouts:
          type: array
          items: {$ref: "#/components/schemas/PayoutRow"}
        organisations:
          type: array
          items: {$ref: "#/components/schemas/PayoutOrgSummary"}
        totalQueuedGbp: {type: number}
        failureCount: {type: integer}
    PayoutSettlementInput:
      type: object
      additionalProperties: false
      required: [orgId, reference]
      properties:
        orgId: {type: string, minLength: 1}
        reference: {type: string, minLength: 1, maxLength: 120}
    PayoutSettlementResult:
      type: object
      required: [orgId, orgName, amountGbp, status]
      properties:
        orgId: {type: string}
        orgName: {type: string}
        amountGbp: {type: number}
        status: {type: string, enum: [sent, failed, not_due, needs_manual_settlement, locked]}
        batchId: {type: string}
        wiseTransferId: {type: number}
        error: {type: string}
    PayoutRunResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: {$ref: "#/components/schemas/PayoutSettlementResult"}
    OrgPayoutSummary:
      type: object
      required: [pendingGbp, lastSettled, payoutMethod]
      properties:
        pendingGbp: {type: number}
        payoutMethod: {type: string, enum: [stripe_connect, wise, manual, none]}
        lastSettled:
          type: object
          nullable: true
          required: [amountGbp, sentAt]
          properties:
            amountGbp: {type: number}
            sentAt: {type: string, nullable: true}
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    PublicUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        accountType:
          type: string
          enum: [supporter, organisation]
        avatarInitials:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - name
        - email
        - accountType
        - createdAt

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          minLength: 8
        accountType:
          type: string
          enum: [supporter, organisation]
      required:
        - name
        - email
        - password
        - accountType

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/PublicUser"
      required:
        - token
        - user

    CampaignAssistRequest:
      type: object
      properties:
        campaignId: {type: string}
        field: {type: string, enum: [tagline, description, breakdown.detail, locations.description]}
        instruction: {type: string, maxLength: 1000}
      required: [campaignId, field, instruction]
    CampaignEditorRequest:
      type: object
      properties:
        name: {type: string, maxLength: 200}
        tagline: {type: string, maxLength: 140}
        description: {type: string, maxLength: 20000}
        type: {type: string, enum: [fundraising, volunteer]}
        goal: {type: number, minimum: 0}
        volunteersNeeded: {type: number, minimum: 0}
        deadline: {type: string, nullable: true}
        imageUrl: {type: string, nullable: true}
        partnerFunding:
          type: object
          nullable: true
          properties:
            amount: {type: number, minimum: 0}
            funderName: {type: string, maxLength: 200}
            type: {type: string, enum: [committed, matching], default: committed}
            matchRatio: {type: number, exclusiveMinimum: 0, default: 1}
            matchCap: {type: number, minimum: 0, description: "Matching only; defaults to amount."}
          required: [amount, funderName, type]
        breakdown:
          type: array
          maxItems: 50
          items:
            type: object
            properties: {label: {type: string}, detail: {type: string}}
            required: [label, detail]
        locations:
          type: array
          maxItems: 3
          items:
            type: object
            properties: {name: {type: string}, description: {type: string}, photoUrl: {type: string}}
            required: [name, description, photoUrl]
        video:
          type: object
          nullable: true
          properties: {url: {type: string}, posterUrl: {type: string}, captionsUrl: {type: string}}
          required: [url, posterUrl, captionsUrl]
        theme:
          type: object
          properties:
            primaryColor: {type: string}
            accentColor: {type: string}
            backgroundColor: {type: string}
            textColor: {type: string}
            unit:
              type: object
              properties: {singular: {type: string, maxLength: 60}, plural: {type: string, maxLength: 60}, imageUrl: {type: string}}
              required: [singular, plural, imageUrl]
        enabled: {type: boolean}
        saveAsDraft: {type: boolean}
        editorStep: {type: integer, minimum: 1, maximum: 5}
        assistUsed: {type: boolean}
        partnerFundingAnswer: {type: string, nullable: true, enum: [yes, no, null]}
        unitChosen: {type: boolean}
    EditorCampaign:
      allOf:
