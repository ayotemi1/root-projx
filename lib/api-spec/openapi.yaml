openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Root ProjX API — community giving platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: organisations
    description: Organisation profiles
  - name: donations
    description: Donation flows
  - name: feed
    description: Impact updates
  - name: follows
    description: Follow relationships
  - name: help
    description: Get Help directory
  - name: profile
    description: User profile
paths:
  /admin/email/test:
    post:
      operationId: sendAdminTestEmail
      summary: Send one labelled test email to the configured team address
      parameters:
        - in: header
          name: x-admin-token
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Brevo accepted the message, not proof of inbox delivery
          content:
            application/json:
              schema:
                type: object
                required: [accepted, recipient, environment, sentAt]
                properties:
                  accepted: {type: boolean}
                  recipient: {type: string}
                  environment: {type: string, enum: [production, development]}
                  sentAt: {type: string}
        '401': {description: Administrator authentication required}
        '429': {description: Wait one minute between attempts}
        '502': {description: Brevo rejected the request or could not be reached}
        '503': {description: Administrator or email configuration missing}
  /payout/bank-details:
    get:
      operationId: getBankDetailsStatus
      tags: [profile]
      summary: Get the owning organisation's bank-detail submission status
      responses:
        '200':
          description: Private status only, never account numbers
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BankDetailsStatus'}
        '401': {description: Sign-in required}
        '403': {description: Approved organisation owner required}
        '503': {description: Secure storage unavailable}
    put:
      operationId: saveBankDetails
      tags: [profile]
      summary: Encrypt and save payout bank details, withdrawing previous approval atomically
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BankDetailsInput'}
      responses:
        '200':
          description: Saved for administrator review, not approved and no money sent
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BankDetailsStatus'}
        '400': {description: Invalid bank details}
        '401': {description: Sign-in required}
        '403': {description: Approved organisation owner required}
        '503': {description: Save failed or secure storage unavailable}
  /admin/organisations/{id}/bank-details/status:
    get:
      operationId: getAdminBankDetailsStatus
      tags: [profile]
      summary: Metadata-only bank review with no decryption
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Submission status only
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BankDetailsStatus'}
        '401': {description: Administrator authentication required}
        '404': {description: Organisation not found}
        '503': {description: Secure storage unavailable}
  /admin/organisations/{id}/bank-details:
    get:
      operationId: reviewBankDetails
      tags: [profile]
      summary: Explicit audited reveal of decrypted bank details, never cache
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Submission status and private bank details
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/BankDetailsStatus'}
                  - type: object
                    properties:
                      details:
                        anyOf:
                          - {$ref: '#/components/schemas/BankDetailsInput'}
                          - {type: 'null'}
        '401': {description: Administrator authentication required}
        '503': {description: Secure storage or durable audit unavailable}
  /admin/organisations/{id}/bank-details/approve:
    post:
      operationId: approveBankDetails
      tags: [profile]
      summary: Approve exactly the reviewed bank-detail revision
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BankDetailsApprovalInput'}
      responses:
        '200': {description: "Approved, no money has been sent"}
        '400': {description: Missing revision}
        '401': {description: Administrator authentication required}
        '409': {description: "Details changed or payout in progress, reopen the review"}
  /auth/forgot-password:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request a Firebase password-reset email
      description: Rate-limited. Returns the same confirmation for registered and unknown addresses. Firebase handles expiring single-use reset links.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordResetRequest'}
      responses:
        '200':
          description: Neutral confirmation that does not reveal account existence
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string}
        '400': {description: Invalid email}
        '429': {description: Too many requests}
        '503': {description: Reset email provider temporarily unavailable}
  /auth/reset-password:
    post:
      operationId: applyPasswordReset
      tags: [auth]
      summary: Verify a reset code or apply a new password using that code
      description: No sign-in required. Omitting newPassword verifies only and does not consume the code. Firebase enforces expiry, single use and password policy. Never log request bodies.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordResetActionInput'}
      responses:
        '200':
          description: Valid code or password successfully changed
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: {type: string}
        '400': {description: "Expired or invalid code, or password does not meet requirements"}
        '429': {description: Too many requests}
        '503': {description: Reset provider temporarily unavailable}
  /donations/checkout:
    post:
      operationId: createDonationCheckoutSession
      tags: [donations]
      summary: Create a donation Checkout session with optional public-name consent
      description: Supports a signed-in donor or a guest supplying guestEmail. Account names and privacy preferences are read server-side for signed-in donors.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DonationCheckoutInput'}
      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DonationCheckoutResult'}
        '400': {description: Invalid donation or public-name consent}
  /donations/anonymous-checkout:
    post:
      operationId: createAnonymousDonationCheckoutSession
      tags: [donations]
      summary: Create a no-account Checkout session with optional public-name consent
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DonationCheckoutInput'}
      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DonationCheckoutResult'}
        '400': {description: Invalid donation or public-name consent}
  /organisations/{id}/campaigns/{campId}/preview:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: campId, in: path, required: true, schema: {type: string}}
    get:
      operationId: getOwnerCampaignPreview
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Owner-only actual campaign render data; never publicly cached
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CampaignLandingView"}
        "403": {description: Only the approved owning organisation may preview}
  /organisations/{id}/dashboard-summary:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getOrganisationRunningSummary
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Available balances and activity; unavailable sections are explicitly identified
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OrganisationRunningSummary"}
        "503": {description: Retry loading balances; no zero fallback}
  /organisations/{id}/walkthrough:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getOrganisationWalkthrough
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Private resume state and actual preview interactions
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WalkthroughView"}
    patch:
      operationId: saveOrganisationWalkthrough
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WalkthroughProgress"}
      responses:
        "200":
          description: Saved resume pointer; completion must satisfy actual saved content
          content:
            application/json:
              schema:
                type: object
                properties:
                  walkthrough: {$ref: "#/components/schemas/WalkthroughProgress"}
        "400": {description: Complete the required saved actions before finishing}
  /organisations/{id}/walkthrough/events:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      operationId: recordOrganisationPreviewOpen
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WalkthroughPreviewEvent"}
      responses:
        "200":
          description: Preview interaction recorded separately from resume state
          content:
            application/json:
              schema:
                type: object
                properties: {recorded: {type: boolean}, at: {type: string}}
  /wise/disbursements:
    get:
      operationId: getWiseDisbursements
      security: [{adminSecret: []}]
      parameters:
        - in: query
          name: orgId
          required: true
          schema:
            type: string
            minLength: 1
            pattern: '^[^/\s]+$'
      responses:
        "200":
          description: Full organisation disbursement history, newest first
          content:
            application/json:
              schema:
                type: object
                required: [disbursements]
                properties:
                  disbursements:
                    type: array
                    items: {$ref: "#/components/schemas/WiseDisbursement"}
        "400": {description: Invalid or missing organisation ID}
        "401": {description: Admin secret required}
        "503": {description: Admin access not configured}
        "500": {description: History unavailable}
  /organisations/{id}/campaigns:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getPublicCampaigns
      responses:
        "200":
          description: Published campaigns only
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/EditorCampaign"}}
    post:
      operationId: createCampaignDraft
      security: [{bearerAuth: []}]
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CampaignEditorRequest"}
      responses:
        "201":
          description: New private draft; empty content is allowed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EditorCampaign"}
  /organisations/{id}/campaigns/manage:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      operationId: getManagedCampaignDrafts
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Owner-only campaigns with pending revisions overlaid
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/EditorCampaign"}}
  /organisations/{id}/campaigns/{campId}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - {name: campId, in: path, required: true, schema: {type: string}}
    patch:
      operationId: saveCampaignDraft
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CampaignEditorRequest"}
      responses:
        "200":
          description: Updated owner view; published content remains unchanged when saveAsDraft is true
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EditorCampaign"}
        "400":
          description: Correct the fields or unmet publish gates and retry
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string}
                  unmetGates:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        message: {type: string}
                        step: {type: integer}
    delete:
      operationId: deleteManagedCampaign
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Campaign deleted}
  /campaigns/assist/status:
    get:
      operationId: getCampaignAssistStatus
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Feature flag; defaults off
          content:
            application/json:
              schema:
                type: object
                properties: {enabled: {type: boolean}}
                required: [enabled]
  /campaigns/assist:
    post:
      operationId: requestCampaignWritingSuggestion
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignAssistRequest"
      responses:
        "200":
          description: A suggestion only; no campaign is written
          content:
            application/json:
              schema:
                type: object
                properties: {suggestion: {type: string}}
        "503":
          description: Writing assistant is unconfigured; manual editing remains available
        "429": {description: Wait a minute before requesting another suggestion}
  /admin/organisations/{id}:
    delete:
      operationId: deleteAdminOrganisation
      security: [{adminToken: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OrganisationDeletionInput"}
      responses:
        "200":
          description: Removed from public and owner access; financial history retained
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OrganisationDeletionResult"}
        "400": {description: Invalid ID or organisation name confirmation}
        "401": {description: Admin authentication required}
        "404": {description: Organisation not found}
        "409": {description: Recurring donations must be canceled first}
        "500": {description: Deletion failed; retry permitted}
  /admin/payouts:
    get:
      operationId: getAdminPayouts
      security: [{adminToken: []}]
      responses:
        "200":
          description: Payout ledger and organisation balances
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PayoutOverview"}
        "401": {description: Admin authentication required}
        "500": {description: Payout ledger unavailable}
  /admin/payouts/run:
    post:
      operationId: runAdminPayouts
      security: [{adminToken: []}]
      responses:
        "200":
          description: Per-organisation settlement outcomes
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PayoutRunResult"}
        "401": {description: Admin authentication required}
        "500": {description: Run could not start}
  /admin/payouts/mark-sent:
    post:
      operationId: markAdminPayoutsSent
      security: [{adminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PayoutSettlementInput"}
      responses:
        "200":
          description: Eligible queued payouts marked sent
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PayoutSettlementResult"}
        "400": {description: Invalid organisation or reference}
        "401": {description: Admin authentication required}
        "409":
          description: No eligible payouts or settlement locked
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PayoutSettlementResult"}
        "500": {description: Recording failed; reconcile before retrying}
  /payouts/my:
    get:
      operationId: getMyPayoutSummary
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Authenticated organisation's private payout summary
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OrgPayoutSummary"}
        "401": {description: Authentication required}
        "403": {description: Approved organisation required}
        "500": {description: Payout summary unavailable}
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organisations:
    get:
      operationId: listOrganisations
      tags: [organisations]
      summary: List organisations
      parameters:
        - name: country
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of organisations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organisation"
    post:
      operationId: createOrganisation
      tags: [organisations]
      summary: Create organisation profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganisationRequest"
      responses:
        "201":
          description: Organisation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"

  /organisations/{id}:
    get:
      operationId: getOrganisation
      tags: [organisations]
      summary: Get organisation by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Organisation profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateOrganisation
      tags: [organisations]
      summary: Update organisation
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganisationRequest"
      responses:
        "200":
          description: Updated organisation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organisation"

  /donations:
    post:
      operationId: createDonation
      tags: [donations]
      summary: Create a donation intent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDonationRequest"
      responses:
        "201":
          description: Donation intent created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationIntentResponse"

  /donations/my:
    get:
      operationId: getMyDonations
      tags: [donations]
      summary: Get my donation history
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Donation history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DonationWithOrg"

  /feed:
    get:
      operationId: getFeed
      tags: [feed]
      summary: Get feed for current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Feed updates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UpdateWithOrg"
    post:
      operationId: postUpdate
      tags: [feed]
      summary: Publish an organisation post with optional caption, media and social link
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUpdateRequest"
      responses:
        "201":
          description: Update posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Update"

  /feed/public:
    get:
      operationId: getPublicFeed
      tags: [feed]
      summary: Get public feed (no auth required)
      responses:
        "200":
          description: Public feed updates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UpdateWithOrg"

  /feed/org/{id}:
    get:
      operationId: getOrgFeed
      tags: [feed]
      summary: Get updates for a specific org
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Org updates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Update"

  /follows:
    post:
      operationId: followOrg
      tags: [follows]
      summary: Follow an organisation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowRequest"
      responses:
        "201":
          description: Followed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /follows/my:
    get:
      operationId: getMyFollows
      tags: [follows]
      summary: Get orgs the current user follows
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Followed orgs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organisation"

  /follows/{orgId}:
    delete:
      operationId: unfollowOrg
      tags: [follows]
      summary: Unfollow an organisation
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unfollowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /help/orgs:
    get:
      operationId: getHelpOrgs
      tags: [help]
      summary: Get orgs opted into Get Help
      parameters:
        - name: need
          in: query
          schema:
            type: string
        - name: country
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Help orgs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organisation"

  /help/contact:
    post:
      operationId: logContactEvent
      tags: [help]
      summary: Log a contact event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactEventRequest"
      responses:
        "201":
          description: Contact event logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /help/reviews/{orgId}:
    get:
      operationId: getHelpReviews
      tags: [help]
      summary: Get help reviews for an org
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Help reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelpReview"

  /help/reviews:
    post:
      operationId: submitHelpReview
      tags: [help]
      summary: Submit a help review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitHelpReviewRequest"
      responses:
        "201":
          description: Review submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpReview"

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile with org if applicable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"

components:
  securitySchemes:
    adminSecret:
      type: apiKey
      in: header
      name: X-Admin-Secret
    adminToken:
      type: apiKey
      in: header
      name: x-admin-token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    OrganisationDeletionInput:
      type: object
      required: [confirmationName]
      properties:
        confirmationName: {type: string}
    OrganisationDeletionResult:
      type: object
      required: [deleted, orgId]
      properties:
        deleted: {type: boolean}
        orgId: {type: string}
    BankDetailsStatus:
      type: object
      required: [hasDetails, revision, submittedAt, approved]
      properties:
        hasDetails: {type: boolean}
        revision: {type: [string, 'null']}
        submittedAt: {type: [string, 'null']}
        approved: {type: boolean}
    BankDetailsApprovalInput:
      type: object
      required: [revision]
      properties:
        revision: {type: string, minLength: 1}
    BankDetailsInput:
      type: object
      additionalProperties: false
      required: [accountHolder, bankName, bankCountry, currency]
      description: Account number or IBAN required. UK accounts need a sort code unless using IBAN; US accounts need a routing number.
      properties:
        accountHolder: {type: string, minLength: 1, maxLength: 150}
        bankName: {type: string, minLength: 1, maxLength: 150}
        bankCountry: {type: string, minLength: 2, maxLength: 2}
        currency: {type: string, minLength: 3, maxLength: 3}
        accountNumber: {type: string, maxLength: 34}
        iban: {type: string, maxLength: 34}
        routingCode: {type: string, maxLength: 30}
        swiftBic: {type: string, maxLength: 11}
        branchName: {type: string, maxLength: 150}
        bankAddress: {type: string, maxLength: 300}
        beneficiaryAddress: {type: string, maxLength: 300}
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 254}
    PasswordResetActionInput:
      type: object
      required: [oobCode]
      properties:
        oobCode: {type: string, minLength: 1, maxLength: 2048}
        newPassword: {type: string, minLength: 6, maxLength: 4096, writeOnly: true}
    DonationCheckoutInput:
      type: object
      required: [orgId, amountPence]
      properties:
        orgId: {type: string}
        campaignId: {type: string}
        currency: {type: string, enum: [gbp, usd], description: "Must match the campaign currency. Organisation-wide donations remain GBP."}
        amountPence: {type: integer, minimum: 300}
        originalAmountPence: {type: integer, minimum: 300}
        feeCovered: {type: boolean}
        feeAmountPence: {type: integer, minimum: 0}
        guestEmail: {type: string, format: email}
        anonymousDonorId: {type: string}
        wallOptIn:
          type: boolean
          default: false
          description: Explicit permission to display first name and last initial. Otherwise anonymous.
        donorName:
          type: string
          maxLength: 80
          description: Required when a guest opts in. Reduced to first name and last initial before storing in Stripe metadata. Ignored for signed-in donors.
    DonationCheckoutResult:
      type: object
      required: [url, sessionId]
      properties:
        url: {type: string}
        sessionId: {type: string}
    WiseDisbursement:
      type: object
      required: [_id, orgId, amountGbp, transferId, disbursedAt, recipientEmail]
      properties:
        _id: {type: string}
        orgId: {type: string}
        amountGbp: {type: number}
        transferId: {type: integer}
        disbursedAt: {type: string}
        recipientEmail: {type: [string, "null"]}
    PayoutRow:
      type: object
      required: [_id, orgId, orgName, donationId, stripeRef, amountGbp, currency, method, status, createdAt]
      properties:
        _id: {type: string}
        orgId: {type: string}
        orgName: {type: string}
        donationId: {type: string}
        stripeRef: {type: string}
        amountGbp: {type: number}
        currency: {type: string}
        method: {type: string, enum: [wise, manual]}
        status: {type: string, enum: [queued, sent, failed]}
        createdAt: {type: string}
        batchId: {type: string}
        wiseTransferId: {type: number}
        sentAt: {type: string}
        sentBy: {type: string}
        reference: {type: string}
        error: {type: string}
    PayoutOrgSummary:
      type: object
      required: [orgId, orgName, method, queuedTotalGbp, eligibleTotalGbp, due, settlementLocked]
      properties:
        orgId: {type: string}
        orgName: {type: string}
        method: {type: string, enum: [stripe_connect, wise, manual, none]}
        queuedTotalGbp: {type: number}
        eligibleTotalGbp: {type: number}
        due: {type: boolean}
        settlementLocked: {type: boolean}
    PayoutOverview:
      type: object
      required: [payouts, organisations, totalQueuedGbp, failureCount]
      properties:
        payouts:
          type: array
          items: {$ref: "#/components/schemas/PayoutRow"}
        organisations:
          type: array
          items: {$ref: "#/components/schemas/PayoutOrgSummary"}
        totalQueuedGbp: {type: number}
        failureCount: {type: integer}
    PayoutSettlementInput:
      type: object
      additionalProperties: false
      required: [orgId, reference]
      properties:
        orgId: {type: string, minLength: 1}
        reference: {type: string, minLength: 1, maxLength: 120}
    PayoutSettlementResult:
      type: object
      required: [orgId, orgName, amountGbp, status]
      properties:
        orgId: {type: string}
        orgName: {type: string}
        amountGbp: {type: number}
        status: {type: string, enum: [sent, failed, not_due, needs_manual_settlement, locked]}
        batchId: {type: string}
        wiseTransferId: {type: number}
        error: {type: string}
    PayoutRunResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: {$ref: "#/components/schemas/PayoutSettlementResult"}
    OrgPayoutSummary:
      type: object
      required: [pendingGbp, lastSettled, payoutMethod]
      properties:
        pendingGbp: {type: number}
        payoutMethod: {type: string, enum: [stripe_connect, wise, manual, none]}
        lastSettled:
          type: object
          nullable: true
          required: [amountGbp, sentAt]
          properties:
            amountGbp: {type: number}
            sentAt: {type: string, nullable: true}
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    PublicUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        accountType:
          type: string
          enum: [supporter, organisation]
        avatarInitials:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - name
        - email
        - accountType
        - createdAt

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          minLength: 8
        accountType:
          type: string
          enum: [supporter, organisation]
      required:
        - name
        - email
        - password
        - accountType

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/PublicUser"
      required:
        - token
        - user

    CampaignAssistRequest:
      type: object
      properties:
        campaignId: {type: string}
        field: {type: string, enum: [tagline, description, breakdown.detail, locations.description]}
        instruction: {type: string, maxLength: 1000}
      required: [campaignId, field, instruction]
    CampaignEditorRequest:
      type: object
      properties:
        currency:
          type: string
          enum: [gbp, usd]
          default: gbp
          description: "Campaign goals and donations use this currency. Locked once checkout has started."
        name: {type: string, maxLength: 200}
        tagline: {type: string, maxLength: 140}
        description: {type: string, maxLength: 20000}
        pageContent:
          type: object
          nullable: true
          description: Optional plain-text editorial sections for the shared campaign page. No financial totals or HTML.
          additionalProperties: {type: string, maxLength: 5000}
        type: {type: string, enum: [fundraising, volunteer]}
        goal: {type: number, minimum: 0}
        volunteersNeeded: {type: number, minimum: 0}
        deadline: {type: string, nullable: true}
        imageUrl: {type: string, nullable: true}
        partnerFunding:
          type: object
          nullable: true
          properties:
            amount: {type: number, minimum: 0}
            funderName: {type: string, maxLength: 200}
            type: {type: string, enum: [committed, matching], default: committed}
            matchRatio: {type: number, exclusiveMinimum: 0, default: 1}
            matchCap: {type: number, minimum: 0, description: "Matching only; defaults to amount."}
          required: [amount, funderName, type]
        breakdown:
          type: array
          maxItems: 50
          items:
            type: object
            properties: {label: {type: string}, detail: {type: string}}
            required: [label, detail]
        locations:
          type: array
          maxItems: 3
          items:
            type: object
            properties: {name: {type: string}, description: {type: string}, photoUrl: {type: string}}
            required: [name, description, photoUrl]
        video:
          type: object
          nullable: true
          properties: {url: {type: string}, posterUrl: {type: string, nullable: true}, captionsUrl: {type: string, nullable: true}, caption: {type: string, maxLength: 2000}}
          required: [url, posterUrl, captionsUrl]
        videos:
          type: array
          maxItems: 10
          description: "Ordered campaign videos. When present, replaces the legacy single video, including an empty array to remove all videos."
          items:
            type: object
            properties:
              url: {type: string}
              posterUrl: {type: string, nullable: true}
              captionsUrl: {type: string, nullable: true}
              caption: {type: string, maxLength: 2000}
            required: [url, posterUrl, captionsUrl]
        theme:
          type: object
          properties:
            primaryColor: {type: string}
            accentColor: {type: string}
            backgroundColor: {type: string}
            textColor: {type: string}
            unit:
              type: object
              nullable: true
              description: "Drafts may have no unit selected, or a custom unit whose image has not been uploaded yet."
              properties: {singular: {type: string, maxLength: 60}, plural: {type: string, maxLength: 60}, imageUrl: {type: string, nullable: true}}
              required: [singular, plural, imageUrl]
        enabled: {type: boolean}
        saveAsDraft: {type: boolean}
        editorStep: {type: integer, minimum: 1, maximum: 5}
        assistUsed: {type: boolean}
        partnerFundingAnswer: {type: string, nullable: true, enum: [yes, no, null]}
        unitChosen: {type: boolean}
    EditorCampaign:
      allOf:
        - $ref: "#/components/schemas/CampaignEditorRequest"
        - type: object
          properties:
            _id: {type: string}
            publicId: {type: string}
            amountRaised: {type: number}
            partnerFundingMatchedGbp: {type: number, minimum: 0, readOnly: true}
            currencyLockedAt: {type: string, nullable: true, readOnly: true}
            status: {type: string}
            hasUnpublishedChanges: {type: boolean}
            sharePath: {type: string}
            createdAt: {type: string}
            updatedAt: {type: string}
            supporterCount: {type: integer, minimum: 0}
            unidentifiedGifts: {type: integer, minimum: 0}
            recentSupporters:
              type: array
              items: {$ref: "#/components/schemas/RecentCampaignSupporter"}
            supporterUnits:
              description: Newest counted supporters first; public consent-filtered names only, matching individually drawn units
              type: array
              maxItems: 300
              items: {$ref: "#/components/schemas/RecentCampaignSupporter"}
          required: [_id, amountRaised, enabled]

    RecentCampaignSupporter:
      type: object
      properties: {displayName: {type: string}, createdAt: {type: string}}
      required: [displayName, createdAt]
    CampaignLandingView:
      type: object
      properties:
        campaign: {$ref: "#/components/schemas/EditorCampaign"}
        organisation:
          type: object
          additionalProperties: true
          properties: {_id: {type: string}, name: {type: string}}
          required: [_id, name]
        preview: {type: boolean}
      required: [campaign, organisation]
    WalkthroughProgress:
      type: object
      properties:
        profileStep: {type: integer, minimum: 1, maximum: 10, nullable: true}
        campaignStep: {type: integer, minimum: 1, maximum: 12, nullable: true}
        profileDone: {type: boolean}
        campaignDone: {type: boolean}
        exitedAt: {type: string, nullable: true}
        selectedCampaignId: {type: string, nullable: true}
    WalkthroughView:
      type: object
      properties:
        walkthrough: {$ref: "#/components/schemas/WalkthroughProgress"}
        profilePreviewedAt: {type: string, nullable: true}
        campaignPreviewedAt: {type: string, nullable: true}
        campaignPreviewedId: {type: string, nullable: true}
        payoutSetupSelected: {type: boolean}
      required: [walkthrough, payoutSetupSelected]
    WalkthroughPreviewEvent:
      type: object
      properties:
        event: {type: string, enum: [profile_preview, campaign_preview]}
        campaignId: {type: string}
      required: [event]
    OrganisationRunningSummary:
      type: object
      properties:
        raisedGbp: {type: number}
        owedGbp: {type: number, nullable: true}
        unavailable:
          description: Sections whose sources could not be read; nulls or empty arrays for these sections are not zero or empty confirmations
          type: array
          items: {type: string, enum: [payouts, payoutHistory, supporters, posts]}
        nextPayoutAt: {type: string, nullable: true}
        lastPayout:
          type: object
          nullable: true
          properties: {amountGbp: {type: number}, reference: {type: string}, sentAt: {type: string}}
          required: [amountGbp, reference, sentAt]
        recentSupporters:
          type: array
          items: {$ref: "#/components/schemas/RecentCampaignSupporter"}
        campaignRaised:
          type: array
          items:
            type: object
            properties: {campaignId: {type: string}, name: {type: string}, raisedGbp: {type: number}}
            required: [campaignId, name, raisedGbp]
        latestUpdateAt: {type: string, nullable: true}
        impactMetricsStale: {type: boolean}
      required: [raisedGbp, owedGbp, nextPayoutAt, lastPayout, recentSupporters, campaignRaised, latestUpdateAt, impactMetricsStale]

    OrganisationProfileFields:
      type: object
      properties:
        name: {type: string, maxLength: 200}
        country: {type: string, maxLength: 100}
        city: {type: string, nullable: true, maxLength: 120}
        shortDescription: {type: string, maxLength: 120}
        description: {type: string, maxLength: 20000}
        mission: {type: string, nullable: true, maxLength: 20000}
        category: {type: string}
        categories:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string}
        logo: {type: string, nullable: true}
        coverImage: {type: string, nullable: true}
        contact:
          type: object
          nullable: true
          properties:
            email: {type: string}
            phone: {type: string}
            website: {type: string}
        socialLinks:
          type: object
          nullable: true
          properties:
            instagram: {type: string}
            facebook: {type: string}
            twitter: {type: string}
            linkedin: {type: string}
            youtube: {type: string}
            tiktok: {type: string}
        impactMetrics:
          type: object
          nullable: true
          properties:
            peopleReached: {$ref: "#/components/schemas/ProfileImpactMetric"}
            groundCovered: {$ref: "#/components/schemas/ProfileImpactMetric"}
            resourcesDelivered: {$ref: "#/components/schemas/ProfileImpactMetric"}
        team:
          type: array
          maxItems: 6
          items: {$ref: "#/components/schemas/ProfileTeamMember"}
        fundsUsage:
          type: object
          nullable: true
          properties:
            operations: {type: integer, minimum: 0, maximum: 100}
            materials: {type: integer, minimum: 0, maximum: 100}
            staff: {type: integer, minimum: 0, maximum: 100}
            events: {type: integer, minimum: 0, maximum: 100}
            other: {type: integer, minimum: 0, maximum: 100}
          required: [operations, materials, staff, events, other]

    ProfileImpactMetric:
      type: object
      properties:
        label: {type: string, maxLength: 100}
        value: {type: number, minimum: 0}
        updatedAt:
          type: string
          description: Server-owned timestamp; client-supplied values are ignored.
      required: [label, value]

    ProfileTeamMember:
      type: object
      properties:
        name: {type: string, maxLength: 100}
        role: {type: string, maxLength: 120}
        photoUrl: {type: string}
      required: [name, role, photoUrl]

    Organisation:
      type: object
      allOf:
        - $ref: "#/components/schemas/OrganisationProfileFields"
      properties:
        payoutMethod:
          type: string
          enum: [stripe_connect, wise, manual, none]
          description: Resolved payout routing method; not a provider-readiness or settlement guarantee.
        id:
          type: integer
        userId:
          type: integer
          nullable: true
        orgName:
          type: string
        mission:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        country:
          type: string
        causeCategory:
          type: string
          nullable: true
        goalAmount:
          type: string
          nullable: true
        raisedAmount:
          type: string
          nullable: true
        distributedAmount:
          type: string
          nullable: true
        donorCount:
          type: integer
          nullable: true
        followerCount:
          type: integer
          nullable: true
        verified:
          type: boolean
          nullable: true
        helpOptedIn:
          type: boolean
          nullable: true
        helpServices:
          type: array
          items:
            type: string
          nullable: true
        responseCommitment:
          type: string
          nullable: true
        whatsappNumber:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - orgName
        - country
        - createdAt

    CreateOrganisationRequest:
      type: object
      properties:
        orgName:
          type: string
        mission:
          type: string
        location:
          type: string
        country:
          type: string
        causeCategory:
          type: string
        goalAmount:
          type: string
        helpOptedIn:
          type: boolean
        helpServices:
          type: array
          items:
            type: string
        responseCommitment:
          type: string
        whatsappNumber:
          type: string
      required:
        - orgName
        - country

    UpdateOrganisationRequest:
      type: object
      allOf:
        - $ref: "#/components/schemas/OrganisationProfileFields"
      properties:
        orgName:
          type: string
        mission:
          type: string
        location:
          type: string
        country:
          type: string
        causeCategory:
          type: string
        goalAmount:
          type: string
        helpOptedIn:
          type: boolean
        helpServices:
          type: array
          items:
            type: string
        responseCommitment:
          type: string
        whatsappNumber:
          type: string

    CreateDonationRequest:
      type: object
      properties:
        orgId:
          type: integer
        amount:
          type: number
        currency:
          type: string
          default: GBP
        type:
          type: string
          enum: [one-time, recurring]
        processor:
          type: string
          enum: [stripe, paypal]
      required:
        - orgId
        - amount
        - type
        - processor

    DonationIntentResponse:
      type: object
      properties:
        donationId:
          type: integer
        clientSecret:
          type: string
          nullable: true
        approvalUrl:
          type: string
          nullable: true
      required:
        - donationId

    DonationWithOrg:
      type: object
      properties:
        id:
          type: integer
        orgId:
          type: integer
          nullable: true
        orgName:
          type: string
          nullable: true
        amount:
          type: string
        currency:
          type: string
        type:
          type: string
        processor:
          type: string
        status:
          type: string
        createdAt:
          type: string
      required:
        - id
        - amount
        - currency
        - type
        - processor
        - status
        - createdAt

    Update:
      type: object
      properties:
        id:
          type: integer
        orgId:
          type: integer
          nullable: true
        title:
          type: string
        body:
          type: string
        tag:
          type: string
          enum: [Before, During, After]
        mediaUrls:
          type: array
          items:
            type: string
          nullable: true
        externalUrl:
          type: string
          nullable: true
          description: Optional public Instagram, YouTube or Vimeo post link.
        sentToCount:
          type: integer
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - title
        - body
        - tag
        - createdAt

    UpdateWithOrg:
      allOf:
        - $ref: "#/components/schemas/Update"
        - type: object
          properties:
            orgName:
              type: string
              nullable: true
            orgCountry:
              type: string
              nullable: true
            orgVerified:
              type: boolean
              nullable: true

    CreateUpdateRequest:
      type: object
      description: Add at least one photo/video, externalUrl, title or content. No progress-update category is required.
      properties:
        title:
          type: string
        body:
          type: string
          deprecated: true
        content:
          type: string
          maxLength: 5000
        type:
          type: string
          description: Legacy post classification; defaults to update when omitted.
        tag:
          type: string
          enum: [Before, During, After]
        mediaUrls:
          type: array
          items:
            type: string
        externalUrl:
          type: string
          description: Optional HTTPS Instagram post/reel, YouTube video or Vimeo video link.

    FollowRequest:
      type: object
      properties:
        orgId:
          type: integer
      required:
        - orgId

    ContactEventRequest:
      type: object
      properties:
        sessionId:
          type: string
        orgId:
          type: integer
        needCategory:
          type: string
        channel:
          type: string
          enum: [whatsapp, email]
      required:
        - orgId
        - needCategory
        - channel

    HelpReview:
      type: object
      properties:
        id:
          type: integer
        orgId:
          type: integer
          nullable: true
        reviewerName:
          type: string
          nullable: true
        rating:
          type: integer
        body:
          type: string
          nullable: true
        verifiedRecipient:
          type: boolean
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - rating
        - createdAt

    SubmitHelpReviewRequest:
      type: object
      properties:
        orgId:
          type: integer
        reviewerName:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        body:
          type: string
        sessionId:
          type: string
      required:
        - orgId
        - rating

    ProfileResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"
