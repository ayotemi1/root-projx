      parameters:
        - {name: photoId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Discarded an unattached photo owned by this account}
  /bookmarks:
    get:
      operationId: listBookmarks
      tags: [profile]
      responses:
        '200':
          description: Own bookmarks resolved against current content visibility
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/BookmarkView'}}
    post:
      operationId: saveBookmark
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BookmarkInput'}
      responses:
        '200':
          description: Idempotently saved reference
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BookmarkView'}
  /bookmarks/{id}:
    delete:
      operationId: removeBookmark
      tags: [profile]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}}
      responses:
        '204': {description: Own reference removed}

components:
  securitySchemes:
    adminSecret:
      type: apiKey
      in: header
      name: X-Admin-Secret
    adminToken:
      type: apiKey
      in: header
      name: x-admin-token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PostViewerAuthor:
      type: object
      required: [id, name, avatarUrl, verified, href]
      properties:
        id: {type: string}
        name: {type: string}
        avatarUrl: {type: [string, 'null']}
        verified: {type: boolean}
        href: {type: [string, 'null']}
    PostViewerMedia:
      type: object
      required: [url, type]
      properties:
        url: {type: string}
        type: {type: string, enum: [photo, video]}
        thumbnailUrl: {type: [string, 'null']}
        crop: {type: object, additionalProperties: true}
        filter: {type: string}
        adjustments: {type: object, additionalProperties: true}
        width: {type: [number, 'null']}
        height: {type: [number, 'null']}
    PostViewerRecord:
      type: object
      required: [id, kind, author, caption, title, createdAt, media, externalUrl]
      properties:
        id: {type: string}
        kind: {type: string, enum: [update, post]}
        author: {$ref: '#/components/schemas/PostViewerAuthor'}
        caption: {type: string}
        title: {type: string}
        createdAt: {type: string}
        media: {type: array, items: {$ref: '#/components/schemas/PostViewerMedia'}}
        externalUrl: {type: [string, 'null']}
    PostViewerComment:
      type: object
      required: [id, parentId, text, author, createdAt, likes, liked]
      properties:
        id: {type: string}
        parentId: {type: [string, 'null']}
        text: {type: string}
        author: {$ref: '#/components/schemas/PostViewerAuthor'}
        createdAt: {type: string}
        likes: {type: integer}
        liked: {type: boolean}
    PostActivity:
      type: object
      required: [likes, liked, commentCount, comments]
      properties:
        likes: {type: integer}
        liked: {type: boolean}
        commentCount: {type: integer}
        comments: {type: array, items: {$ref: '#/components/schemas/PostViewerComment'}}
    PostReactionInput:
      type: object
      additionalProperties: false
      required: [liked]
      properties:
        liked: {type: boolean}
    PostCommentInput:
      type: object
      additionalProperties: false
      required: [clientId, text]
      properties:
        clientId: {type: string, format: uuid}
        text: {type: string, minLength: 1, maxLength: 2000}
        parentId: {type: [string, 'null']}
    SupporterNotificationChannels:
      type: object
      required: [inApp, email]
      properties:
        inApp: {type: boolean}
        email: {type: boolean}
    SupporterNotificationPreferences:
      type: object
      required: [updates, comments, messages, campaigns, receipts]
      properties:
        updates: {$ref: '#/components/schemas/SupporterNotificationChannels'}
        comments: {$ref: '#/components/schemas/SupporterNotificationChannels'}
        messages: {$ref: '#/components/schemas/SupporterNotificationChannels'}
        campaigns: {$ref: '#/components/schemas/SupporterNotificationChannels'}
        receipts: {$ref: '#/components/schemas/SupporterNotificationChannels'}
    SupporterAccount:
      type: object
      required: [displayName, location, bio, avatarUrl, avatarInitials, email, visibility, messagePolicy, notifications]
      properties:
        displayName: {type: string}
        location: {type: string}
        bio: {type: string}
        avatarUrl: {type: ['string', 'null']}
        avatarInitials: {type: string}
        email: {type: string}
        visibility: {type: string, enum: [public, private]}
        messagePolicy: {type: string, enum: [followed, replies]}
        notifications: {$ref: '#/components/schemas/SupporterNotificationPreferences'}
    SupporterAccountProfileInput:
      type: object
      required: [displayName, location, bio]
      properties:
        displayName: {type: string, minLength: 1, maxLength: 80}
        location: {type: string, maxLength: 100}
        bio: {type: string, maxLength: 160}
        photoId: {type: ['string', 'null'], format: uuid}
    SupporterNotificationPreferenceInput:
      type: object
      required: [category, channel, enabled]
      properties:
        category: {type: string, enum: [updates, comments, messages, campaigns, receipts]}
        channel: {type: string, enum: [inApp, email]}
        enabled: {type: boolean}
    SupporterAccountSettingsInput:
      type: object
      minProperties: 1
      maxProperties: 1
      properties:
        visibility: {type: string, enum: [public, private]}
        messagePolicy: {type: string, enum: [followed, replies]}
        notification: {$ref: '#/components/schemas/SupporterNotificationPreferenceInput'}
    BookmarkInput:
      type: object
      required: [kind, targetId]
      properties:
        kind: {type: string, enum: [post, update, campaign]}
        targetId: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$'}
        orgId: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$'}
    BookmarkView:
      type: object
      required: [id, kind, targetId, orgId, createdAt, available, title, authorName, imageUrl, isVideo, href]
      properties:
        id: {type: string}
        kind: {type: string, enum: [post, update, campaign]}
        targetId: {type: string}
        orgId: {type: ['string', 'null']}
        createdAt: {type: string}
        available: {type: boolean}
        title: {type: string}
        authorName: {type: string}
        imageUrl: {type: ['string', 'null']}
        videoUrl: {type: ['string', 'null'], description: Video preview fallback when no thumbnail exists.}
        isVideo: {type: boolean}
        href: {type: ['string', 'null']}
    MessagingContext:
      type: object
      required: [personal, personalUnreadCount, organisations, unreadCount]
      properties:
        personal: {type: boolean}
        personalUnreadCount: {type: integer, minimum: 0}
        unreadCount: {type: integer, minimum: 0}
        organisations:
          type: array
          items: {$ref: '#/components/schemas/MessagingOrganisation'}
    MessagingOrganisation:
      type: object
      required: [id, name, canManageTeam, unreadCount]
      properties:
        id: {type: string}
        name: {type: string}
        logo: {type: ['string', 'null']}
        canManageTeam: {type: boolean}
        unreadCount: {type: integer, minimum: 0}
    MessageConversationInput:
      type: object
      properties:
        orgId: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$'}
        asOrgId: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$'}
        recipient: {$ref: '#/components/schemas/MessageRecipient'}
    MessageRecipient:
      type: object
      required: [kind, id]
      properties:
        kind: {type: string, enum: [supporter, organisation]}
        id: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$', description: Public supporter ID or organisation ID, never a private account lookup}
    MessageInbox:
      type: object
      required: [conversations, unreadCount]
      properties:
        conversations:
          type: array
          items: {$ref: '#/components/schemas/MessageConversation'}
        unreadCount: {type: integer, minimum: 0}
    MessageConversation:
      type: object
      required: [id, orgId, name, participantLabel, side, lastMessage, updatedAt, unreadCount, canSend]
      properties:
        id: {type: string}
        orgId: {type: string}
        name: {type: string}
        avatarUrl: {type: ['string', 'null']}
        participantLabel: {type: string}
        side: {type: string, enum: [supporter, organisation]}
        lastMessage: {type: string}
        updatedAt: {type: string}
        unreadCount: {type: integer, minimum: 0}
        canSend: {type: boolean}
        peerHref: {type: ['string', 'null']}
        senderLabel: {type: string}
    ConversationMessages:
      type: object
      required: [conversation, messages, hasMore, readThrough]
      properties:
        conversation: {$ref: '#/components/schemas/MessageConversation'}
        messages:
          type: array
          items: {$ref: '#/components/schemas/ConversationMessage'}
        hasMore: {type: boolean}
        nextBeforeSequence: {type: ['integer', 'null']}
        readThrough: {type: integer, minimum: 0}
    ConversationMessage:
      type: object
      required: [id, text, side, createdAt, sequence, incomingIndex]
      properties:
        id: {type: string}
        text: {type: string}
        side: {type: string, enum: [supporter, organisation]}
        createdAt: {type: string}
        sequence: {type: integer, minimum: 1}
        incomingIndex: {type: integer, minimum: 1}
    ConversationMessageInput:
      type: object
      required: [text, clientId]
      properties:
        text: {type: string, minLength: 1, maxLength: 2000}
        clientId: {type: string, pattern: '^[A-Za-z0-9_-]{16,80}$'}
        orgId: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$'}
    ConversationReadInput:
      type: object
      required: [through]
      properties:
        through: {type: integer, minimum: 0}
        orgId: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$'}
    MessagingTeamInput:
      type: object
      required: [userId]
      properties:
        userId: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$'}
    MessagingTeam:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items: {$ref: '#/components/schemas/MessagingTeamMember'}
    MessagingTeamMember:
      type: object
      required: [userId, name]
      properties:
        userId: {type: string}
        name: {type: string}
    ManagedOrganisation:
      type: object
      required: [id, name, logo]
      properties:
        id: {type: string}
        name: {type: string}
        logo: {type: [string, 'null']}
    ManagedOrganisations:
      type: object
      required: [organisations]
      properties:
        organisations:
          type: array
          items: {$ref: '#/components/schemas/ManagedOrganisation'}
    OrganisationManagerSession:
      type: object
      required: [token, organisation]
      properties:
        token: {type: string}
        organisation: {$ref: '#/components/schemas/ManagedOrganisation'}
    OrganisationManagers:
      type: object
      required: [ownerId, members]
      properties:
        ownerId: {type: string}
        members:
          type: array
          items: {$ref: '#/components/schemas/MessagingTeamMember'}
    OrganisationManagerInput:
      type: object
      required: [userId]
      properties:
        userId: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$'}
    SupporterNotification:
      type: object
      required: [id, type, message, createdAt, read, href, name]
      properties:
        id: {type: string}
        type: {type: string, enum: [organisation_post, story, comment, like, campaign_milestone, donation, message, follower]}
        message: {type: string}
        createdAt: {type: string}
        read: {type: boolean}
        href: {type: string}
        name: {type: string}
        avatarUrl: {type: [string, 'null']}
        thumbnailUrl: {type: [string, 'null']}
    SupporterNotificationInbox:
      type: object
      required: [items, unreadCount]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SupporterNotification'}
        unreadCount: {type: integer, minimum: 0}
    SupporterMediaUploadInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 524288000 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/heic, image/heif, video/mp4, video/quicktime] }
    SupporterMediaCompletionInput:
      type: object
      required: [objectPath]
      properties:
        objectPath: { type: string }
    SupporterMediaCrop:
      type: object
      required: [aspect, zoom, x, y]
      properties:
        aspect: { type: string, enum: [original, "1:1", "4:5", "16:9"] }
        zoom: { type: number, minimum: 1, maximum: 3 }
        x: { type: number, minimum: -50, maximum: 50 }
        y: { type: number, minimum: -50, maximum: 50 }
    SupporterMediaAdjustments:
      type: object
      required: [brightness, contrast, saturation]
      properties:
        brightness: { type: number, minimum: 0.5, maximum: 1.5 }
        contrast: { type: number, minimum: 0.5, maximum: 1.5 }
        saturation: { type: number, minimum: 0, maximum: 2 }
    SupporterPostMediaInput:
      type: object
      required: [id, order, crop, filter, adjustments]
      properties:
        id: { type: string }
        order: { type: integer, minimum: 0, maximum: 4 }
        crop: { $ref: "#/components/schemas/SupporterMediaCrop" }
        filter: { type: string, enum: [original, warm, cool, mono] }
        adjustments: { $ref: "#/components/schemas/SupporterMediaAdjustments" }
    SupporterPostMedia:
      allOf:
        - { $ref: "#/components/schemas/SupporterPostMediaInput" }
        - type: object
          required: [url, type, width, height]
          properties:
            post_id: { type: [string, "null"] }
            url: { type: string }
            type: { type: string, enum: [photo, video] }
            width: { type: number }
            height: { type: number }
            duration: { type: [number, "null"] }
            video_thumbnail_url: { type: [string, "null"] }
    SupporterPostTagInput:
      type: object
      required: [type, value]
      properties:
        type: { type: string, enum: [community, cause, place, organisation] }
        value: { type: string, minLength: 1, maxLength: 160 }
    SupporterPostTag:
      allOf:
        - $ref: "#/components/schemas/SupporterPostTagInput"
        - type: object
          required: [label]
          properties:
            label: { type: string }
            description: { type: [string, "null"] }
    SupporterPostInput:
      type: object
      required: [id, type, caption, media]
      properties:
        id: { type: string, description: Stable UUID idempotency key retained for retries }
        type: { type: string, enum: [photo, video, text] }
        caption: { type: string, maxLength: 5000 }
        community_tag: { type: [string, "null"], maxLength: 80 }
        tag:
          anyOf:
            - $ref: "#/components/schemas/SupporterPostTagInput"
            - { type: "null" }
        organisation_id: { type: [string, "null"] }
        campaign_id: { type: [string, "null"] }
        media: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/SupporterPostMediaInput" } }
    SupporterPostRecord:
      type: object
      required: [id, type, caption, author, created_at, edited_at, removed, media, visibility]
      properties:
        id: { type: string }
        type: { type: string, enum: [photo, video, text] }
        caption: { type: string }
        community_tag: { type: [string, "null"] }
        tag:
          anyOf:
            - $ref: "#/components/schemas/SupporterPostTag"
            - { type: "null" }
        organisation_id: { type: [string, "null"] }
        campaign_id: { type: [string, "null"] }
        created_at: { type: string }
        edited_at: { type: [string, "null"] }
        removed: { type: boolean }
        visibility: { type: string, enum: [public, private] }
        media: { type: array, items: { $ref: "#/components/schemas/SupporterPostMedia" } }
        author:
          type: object
          required: [name, initials, publicId, isOwner, following]
          properties:
            name: { type: string }
            initials: { type: string }
            avatarUrl: { type: [string, "null"] }
            publicId: { type: [string, "null"] }
            isOwner: { type: boolean }
            following: { type: boolean }
    SupporterInterests:
      type: object
      additionalProperties: false
      required: [interests]
      properties:
        interests:
          type: array
          maxItems: 12
          uniqueItems: true
          items:
            type: string
            enum:
              - Education
              - Health & Wellbeing
              - Environment
              - Community Development
              - Arts & Culture
              - Economic Empowerment
              - Youth
              - Sport & Recreation
              - Housing & Homelessness
              - Disaster Relief
              - Faith & Spirituality
              - Other
    VideoUploadRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        size: {type: integer, minimum: 1, maximum: 524288000}
        contentType: {type: string, enum: [video/mp4, video/webm, video/quicktime]}
    VideoUploadTarget:
      type: object
      required: [uploadUrl, objectPath]
      properties:
        uploadUrl: {type: string}
        objectPath: {type: string}
    VideoUploadCompletion:
      type: object
      required: [objectPath]
      properties:
        objectPath: {type: string}
    VideoUploadResult:
      type: object
      required: [url]
      properties:
        url: {type: string}
    OrganisationDeletionInput:
      type: object
      required: [confirmationName]
      properties:
        confirmationName: {type: string}
    OrganisationDeletionResult:
      type: object
      required: [deleted, orgId]
      properties:
        deleted: {type: boolean}
        orgId: {type: string}
    BankDetailsStatus:
      type: object
      required: [hasDetails, revision, submittedAt, approved]
      properties:
        hasDetails: {type: boolean}
        revision: {type: [string, 'null']}
        submittedAt: {type: [string, 'null']}
        approved: {type: boolean}
    BankDetailsApprovalInput:
      type: object
      required: [revision]
      properties:
        revision: {type: string, minLength: 1}
    BankDetailsInput:
      type: object
      additionalProperties: false
      required: [accountHolder, bankName, bankCountry, currency]
      description: Account number or IBAN required. UK accounts need a sort code unless using IBAN; US accounts need a routing number.
      properties:
        accountHolder: {type: string, minLength: 1, maxLength: 150}
        bankName: {type: string, minLength: 1, maxLength: 150}
        bankCountry: {type: string, minLength: 2, maxLength: 2}
        currency: {type: string, minLength: 3, maxLength: 3}
        accountNumber: {type: string, maxLength: 34}
        iban: {type: string, maxLength: 34}
        routingCode: {type: string, maxLength: 30}
        swiftBic: {type: string, maxLength: 11}
        branchName: {type: string, maxLength: 150}
        bankAddress: {type: string, maxLength: 300}
        beneficiaryAddress: {type: string, maxLength: 300}
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email, maxLength: 254}
    PasswordResetActionInput:
      type: object
      required: [oobCode]
      properties:
        oobCode: {type: string, minLength: 1, maxLength: 2048}
        newPassword: {type: string, minLength: 6, maxLength: 4096, writeOnly: true}
    DonationCheckoutInput:
      type: object
      required: [orgId, amountPence]
      properties:
        orgId: {type: string}
        campaignId: {type: string}
        currency: {type: string, enum: [gbp, usd], description: "Must match the campaign currency. Organisation-wide donations remain GBP."}
        amountPence: {type: integer, minimum: 300}
        originalAmountPence: {type: integer, minimum: 300}
        feeCovered: {type: boolean}
        feeAmountPence: {type: integer, minimum: 0}
        guestEmail: {type: string, format: email}
        anonymousDonorId: {type: string}
        wallOptIn:
          type: boolean
          default: false
          description: Explicit permission to display first name and last initial. Otherwise anonymous.
        donorName:
          type: string
          maxLength: 80
          description: Required when a guest opts in. Reduced to first name and last initial before storing in Stripe metadata. Ignored for signed-in donors.
    DonationCheckoutResult:
      type: object
      required: [url, sessionId]
      properties:
        url: {type: string}
        sessionId: {type: string}
    WiseDisbursement:
      type: object
      required: [_id, orgId, amountGbp, transferId, disbursedAt, recipientEmail]
      properties:
        _id: {type: string}
        orgId: {type: string}
        amountGbp: {type: number}
        transferId: {type: integer}
        disbursedAt: {type: string}
        recipientEmail: {type: [string, "null"]}
    PayoutRow:
      type: object
      required: [_id, orgId, orgName, donationId, stripeRef, amountGbp, currency, method, status, createdAt]
      properties:
        _id: {type: string}
        orgId: {type: string}
        orgName: {type: string}
        donationId: {type: string}
        stripeRef: {type: string}
        amountGbp: {type: number}
        currency: {type: string}
        method: {type: string, enum: [wise, manual]}
        status: {type: string, enum: [queued, sent, failed]}
        createdAt: {type: string}
        batchId: {type: string}
        wiseTransferId: {type: number}
        sentAt: {type: string}
        sentBy: {type: string}
        reference: {type: string}
        error: {type: string}
    PayoutOrgSummary:
      type: object
      required: [orgId, orgName, method, queuedTotalGbp, eligibleTotalGbp, due, settlementLocked]
      properties:
        orgId: {type: string}
        orgName: {type: string}
        method: {type: string, enum: [stripe_connect, wise, manual, none]}
        queuedTotalGbp: {type: number}
        eligibleTotalGbp: {type: number}
        due: {type: boolean}
        settlementLocked: {type: boolean}
    PayoutOverview:
      type: object
      required: [payouts, organisations, totalQueuedGbp, failureCount]
      properties:
        payouts:
          type: array
          items: {$ref: "#/components/schemas/PayoutRow"}
        organisations:
          type: array
          items: {$ref: "#/components/schemas/PayoutOrgSummary"}
        totalQueuedGbp: {type: number}
        failureCount: {type: integer}
    PayoutSettlementInput:
      type: object
      additionalProperties: false
      required: [orgId, reference]
      properties:
        orgId: {type: string, minLength: 1}
        reference: {type: string, minLength: 1, maxLength: 120}
    PayoutSettlementResult:
      type: object
      required: [orgId, orgName, amountGbp, status]
      properties:
        orgId: {type: string}
        orgName: {type: string}
        amountGbp: {type: number}
        status: {type: string, enum: [sent, failed, not_due, needs_manual_settlement, locked]}
        batchId: {type: string}
        wiseTransferId: {type: number}
        error: {type: string}
    PayoutRunResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: {$ref: "#/components/schemas/PayoutSettlementResult"}
    OrgPayoutSummary:
      type: object
      required: [pendingGbp, lastSettled, payoutMethod]
      properties:
        pendingGbp: {type: number}
        payoutMethod: {type: string, enum: [stripe_connect, wise, manual, none]}
        lastSettled:
          type: object
          nullable: true
          required: [amountGbp, sentAt]
          properties:
            amountGbp: {type: number}
            sentAt: {type: string, nullable: true}
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    PublicUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        accountType:
          type: string
          enum: [supporter, organisation]
        avatarInitials:
          type: string
          nullable: true
        avatarUrl:
          type: [string, "null"]
        createdAt:
          type: string
      required:
        - id
        - name
        - email
        - accountType
        - createdAt

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
